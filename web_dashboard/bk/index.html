<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hacker News Analysis Dashboard</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <!--<script type="module" src="js/script.js" defer></script>-->
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
  <h1>Hacker News Analysis Dashboard</h1>

  <label for="timestampSelector">Select Analysis Timestamp:</label>
  <select id="timestampSelector"></select>
  <button id="refreshTimestamps">🔄 Refresh</button>
  <div class="metadata" id="timestampMeta"></div>

  <fieldset>
    <legend>Toggle Analysis Types</legend>
    <div class="toggle-grid">
      <label><input type="checkbox" class="analysis-toggle" data-section="sentiment" checked> Sentiment</label>
      <label><input type="checkbox" class="analysis-toggle" data-section="keywords" checked> Keywords</label>
      <label><input type="checkbox" class="analysis-toggle" data-section="trending" checked> Trending</label>
      <label><input type="checkbox" class="analysis-toggle" data-section="score" checked> Score</label>
      <label><input type="checkbox" class="analysis-toggle" data-section="titleLength" checked> Title Length</label>
      <label><input type="checkbox" class="analysis-toggle" data-section="comments" checked> Comments</label>
    </div>
  </fieldset>

  <section id="sentiment">
    <h2>Sentiment Analysis</h2>
    <div id="sentimentLegend" style="margin-top: 8px; font-size: 14px;">
      <span style="color: #2ca02c;">⬛ Positive</span>
      &nbsp;&nbsp;
      <span style="color: #d62728;">⬛ Negative</span>
      &nbsp;&nbsp;
      <span style="color: #999999;">⬛ Neutral</span>
    </div>
    <svg id="sentimentChart" width="800" height="400"></svg>
  </section>

  <section id="keywords">
    <h2>Keyword Extraction</h2>
    <svg id="keywordsChart" width="800" height="400"></svg>
  </section>

  <section id="trending">
    <h2>Trending Story Detection</h2>
    <svg id="trendingChart" width="800" height="400"></svg>
  </section>

  <section id="score">
    <h2>Score Dynamics</h2>
    <svg id="scoreChart" width="800" height="400"></svg>
  </section>

  <section id="titleLength">
    <h2>Title Length Distribution</h2>
    <svg id="titleLengthChart" width="800" height="400"></svg>
  </section>

  <section id="comments">
    <h2>Comment Count Analysis</h2>
    <svg id="commentsChart" width="800" height="400"></svg>
  </section>

  <section id="story-table">
    <h2>Top Stories</h2>
    <table id="storyTable" style="width: 100%; border-collapse: collapse;">
      <thead>
        <tr>
          <th>Title</th>
          <th>Score</th>
          <th>Comments</th>
          <th>Sentiment</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script>
    //const S3_BASE = "https://YOUR_BUCKET.s3.amazonaws.com/analysis";
const S3_BASE = "http://localhost:8000/example_data";
const modules = [
  ['sentimentChart', 'sentiment_analysis'],
  ['keywordsChart', 'keyword_extraction'],
  ['trendingChart', 'trending_detection'],
  ['scoreChart', 'score_dynamics'],
  ['titleLengthChart', 'title_length_distribution'],
  ['commentsChart', 'comment_count_analysis']
];

async function loadTimestamps() {
  const response = await fetch(`${S3_BASE}/index.json`);
  const timestamps = await response.json();
  const selector = document.getElementById('timestampSelector');
  selector.innerHTML = '';
  timestamps.forEach(ts => {
    const option = document.createElement('option');
    option.value = ts;
    option.textContent = ts;
    selector.appendChild(option);
  });
  selector.addEventListener('change', () => {
    const timestamp = selector.value;
    loadCharts(timestamp);
    updateMetadata(timestamp);
    loadStoryTable(timestamp);
  });
  if (timestamps.length > 0) {
    const initialTimestamp = timestamps[0];
    selector.value = initialTimestamp;
    loadCharts(initialTimestamp);
    updateMetadata(initialTimestamp);
    loadStoryTable(initialTimestamp);
  }
}

document.getElementById('refreshTimestamps').addEventListener('click', loadTimestamps);

function updateMetadata(timestamp) {
  const metaDiv = document.getElementById('timestampMeta');
  metaDiv.textContent = `Currently showing analysis for: ${timestamp}`;
}

function loadCharts(timestamp) {
  modules.forEach(([chartId, filename]) => {
    const sectionId = chartId.replace("Chart", "");
    const toggle = document.querySelector(`.analysis-toggle[data-section="${sectionId}"]`);
    const chartContainer = document.getElementById(chartId);

    if (!toggle.checked) {
      d3.select(chartContainer).selectAll("*").remove();
      return;
    }

    d3.json(`${S3_BASE}/${filename}_${timestamp}.json`).then(data => {
      const svg = d3.select(chartContainer);
      svg.selectAll("*").remove();
      const width = +svg.attr("width") - 80;
      const height = +svg.attr("height") - 80;
      const margin = { top: 50, right: 30, bottom: 60, left: 60 };

      const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

      const tooltip = d3.select("body").append("div")
        .attr("class", "tooltip")
        .style("position", "absolute")
        .style("background", "#f9f9f9")
        .style("padding", "6px")
        .style("border", "1px solid #ccc")
        .style("border-radius", "4px")
        .style("display", "none");

      function addAxes(x, y, xLabel = "X", yLabel = "Y") {
        g.append("g")
          .attr("transform", `translate(0,${height})`)
          .call(d3.axisBottom(x).tickFormat(d3.format(".2s")))
          .selectAll("text")
          .attr("transform", "rotate(-40)")
          .style("text-anchor", "end")
          .style("font-size", "10px");

        g.append("g")
          .call(d3.axisLeft(y).tickFormat(d3.format(".2s")))
          .selectAll("text")
          .style("font-size", "10px");

        svg.append("text")
          .attr("x", width / 2 + margin.left)
          .attr("y", height + margin.top + 45)
          .attr("text-anchor", "middle")
          .text(xLabel);

        svg.append("text")
          .attr("transform", "rotate(-90)")
          .attr("x", -height / 2 - margin.top)
          .attr("y", margin.left - 45)
          .attr("text-anchor", "middle")
          .text(yLabel);
      }

      function addTitle(title) {
        svg.append("text")
          .attr("x", (width + margin.left + margin.right) / 2)
          .attr("y", 25)
          .attr("text-anchor", "middle")
          .style("font-size", "16px")
          .style("font-weight", "bold")
          .text(title);
      }

      if (Array.isArray(data) && typeof data[0] === 'number') {
        const x = d3.scaleLinear().domain([0, d3.max(data)]).range([0, width]);
        const bins = d3.bin().domain(x.domain()).thresholds(20)(data);
        const y = d3.scaleLinear().domain([0, d3.max(bins, d => d.length)]).range([height, 0]);

        addAxes(x, y, "Value", "Count");
        addTitle(filename.replace(/_/g, " ").toUpperCase());

        g.selectAll(".bar")
          .data(bins)
          .enter().append("rect")
          .attr("x", d => x(d.x0))
          .attr("width", d => Math.max(0, x(d.x1) - x(d.x0) - 1))
          .attr("y", d => y(d.length))
          .attr("height", d => height - y(d.length))
          .style("fill", "#69b3a2")
          .on("mouseover", (event, d) => {
            tooltip.style("display", "block")
              .html(`Range: ${d.x0.toFixed(1)} - ${d.x1.toFixed(1)}<br>Count: ${d.length}`)
              .style("left", (event.pageX + 10) + "px")
              .style("top", (event.pageY - 28) + "px");
          })
          .on("mouseout", () => tooltip.style("display", "none"));

      } else if (Array.isArray(data) && data[0].id) {
        const yValue = d => d.sentiment ?? d.score ?? d.descendants ?? 0;
        const x = d3.scaleBand().domain(data.map(d => d.id)).range([0, width]).padding(0.1);
        //const y = d3.scaleLinear().domain([0, d3.max(data, yValue)]).range([height, 0]);
        const minY = d3.min(data, yValue);
        const maxY = d3.max(data, yValue);
        const y = d3.scaleLinear()
          .domain([Math.min(minY, 0), Math.max(maxY, 0)])
          .range([height, 0]);

        addAxes(x, y, "Story ID", "Value");
        addTitle(filename.replace(/_/g, " ").toUpperCase());

        g.selectAll(".bar")
          .data(data)
          .enter().append("rect")
          .attr("x", d => x(d.id))
          .attr("width", x.bandwidth())
          .attr("y", d => y(yValue(d)))
          .attr("height", d => Math.abs(y(0) - y(yValue(d))))
          .style("fill", d => {
            console.log(chartId)
              if (chartId === "sentimentChart") {
                const val = yValue(d);
                console.log(val)
                if (val > 0.05) return "#2ca02c";      // green for positive
                if (val < -0.05) return "#d62728";     // red for negative
                return "#999999";                      // gray for near-zero/neutral
              }
              return "#4682b4"; // default for other charts
            })
          .on("mouseover", (event, d) => {
            tooltip.style("display", "block")
              .html(`ID: ${d.id}<br>Value: ${yValue(d)}`)
              .style("left", (event.pageX + 10) + "px")
              .style("top", (event.pageY - 28) + "px");
          })
          .on("mouseout", () => tooltip.style("display", "none"));

      } else if (Array.isArray(data) && typeof data[0] === 'object') {
        const getX = d => d[0] ?? d.time;
        const getY = d => d[1] ?? d.count;
        const x = d3.scaleBand().domain(data.map(getX)).range([0, width]).padding(0.1);
        const y = d3.scaleLinear().domain([0, d3.max(data, getY)]).range([height, 0]);

        addAxes(x, y, "Category", "Count");
        addTitle(filename.replace(/_/g, " ").toUpperCase());

        g.selectAll(".bar")
          .data(data)
          .enter().append("rect")
          .attr("x", d => x(getX(d)))
          .attr("width", x.bandwidth())
          .attr("y", d => y(getY(d)))
          .attr("height", d => height - y(getY(d)))
          .style("fill", "#ff8c00")
          .on("mouseover", (event, d) => {
            tooltip.style("display", "block")
              .html(`Key: ${getX(d)}<br>Value: ${getY(d)}`)
              .style("left", (event.pageX + 10) + "px")
              .style("top", (event.pageY - 28) + "px");
          })
          .on("mouseout", () => tooltip.style("display", "none"));
      }

    }).catch(e => {
      d3.select(chartContainer).selectAll("*").remove();
      d3.select(chartContainer).append("text")
        .attr("x", 10)
        .attr("y", 30)
        .text(`Data not available for ${filename}`)
        .attr("fill", "red");
    });
  });
}


function loadStoryTable(timestamp) {
  const tableBody = document.querySelector('#storyTable tbody');
  tableBody.innerHTML = '';
  d3.json(`${S3_BASE}/story_table_${timestamp}.json`).then(data => {
    data.forEach(story => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${story.title}</td>
        <td>${story.score}</td>
        <td>${story.comments}</td>
        <td>${story.sentiment}</td>
      `;
      tableBody.appendChild(row);
    });
  }).catch(err => {
    const row = document.createElement('tr');
    row.innerHTML = '<td colspan="4" style="color:red;">No story data available.</td>';
    tableBody.appendChild(row);
  });
}

document.querySelectorAll('.analysis-toggle').forEach(toggle => {
  toggle.addEventListener('change', () => {
    const timestamp = document.getElementById('timestampSelector').value;
    loadCharts(timestamp);
  });
});

loadTimestamps();
  </script>
</body>
</html>
