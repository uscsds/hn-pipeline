<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hacker News Analysis Dashboard</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="stylesheet" href="styles/style.css" />
  <style>
    .toggle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
      margin-top: 8px;
      padding: 8px;
      background-color: #f9f9f9;
      border-radius: 8px;
    }
    .toggle-grid label {
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>
  <h1>Hacker News Analysis Dashboard</h1>

  <label for="timestampSelector">Select Analysis Timestamp:</label>
  <select id="timestampSelector"></select>

  <fieldset>
    <legend>Toggle Analysis Types</legend>
    <div class="toggle-grid">
      <label><input type="checkbox" class="analysis-toggle" data-section="sentiment" checked> Sentiment</label>
      <label><input type="checkbox" class="analysis-toggle" data-section="keywords" checked> Keywords</label>
      <label><input type="checkbox" class="analysis-toggle" data-section="trending" checked> Trending</label>
      <label><input type="checkbox" class="analysis-toggle" data-section="score" checked> Score</label>
      <label><input type="checkbox" class="analysis-toggle" data-section="title-length" checked> Title Length</label>
      <label><input type="checkbox" class="analysis-toggle" data-section="comments" checked> Comments</label>
    </div>
  </fieldset>

  <section id="sentiment">
    <h2>Sentiment Analysis</h2>
    <svg id="sentimentChart" width="800" height="400"></svg>
  </section>

  <section id="keywords">
    <h2>Keyword Extraction</h2>
    <svg id="keywordsChart" width="800" height="400"></svg>
  </section>

  <section id="trending">
    <h2>Trending Story Detection</h2>
    <svg id="trendingChart" width="800" height="400"></svg>
  </section>

  <section id="score">
    <h2>Score Dynamics</h2>
    <svg id="scoreChart" width="800" height="400"></svg>
  </section>

  <section id="title-length">
    <h2>Title Length Distribution</h2>
    <svg id="titleLengthChart" width="800" height="400"></svg>
  </section>

  <section id="comments">
    <h2>Comment Count Analysis</h2>
    <svg id="commentsChart" width="800" height="400"></svg>
  </section>

  <script>
    const S3_BASE = "https://YOUR_BUCKET.s3.amazonaws.com/analysis";
    const modules = [
      ['sentimentChart', 'sentiment_analysis'],
      ['keywordsChart', 'keyword_extraction'],
      ['trendingChart', 'trending_detection'],
      ['scoreChart', 'score_dynamics'],
      ['titleLengthChart', 'title_length_distribution'],
      ['commentsChart', 'comment_count_analysis']
    ];

    async function loadTimestamps() {
      const response = await fetch(`${S3_BASE}/index.json`);
      const timestamps = await response.json();
      const selector = document.getElementById('timestampSelector');
      selector.innerHTML = '';
      timestamps.forEach(ts => {
        const option = document.createElement('option');
        option.value = ts;
        option.textContent = ts;
        selector.appendChild(option);
      });
      selector.addEventListener('change', () => loadCharts(selector.value));
      if (timestamps.length > 0) loadCharts(timestamps[0]);
    }

    function loadCharts(timestamp) {
      modules.forEach(([chartId, filename]) => {
        const sectionId = chartId.replace("Chart", "");
        const toggle = document.querySelector(`.analysis-toggle[data-section="${sectionId}"]`);
        const chartContainer = document.getElementById(chartId);

        if (!toggle.checked) {
          d3.select(chartContainer).selectAll("*").remove();
          return;
        }

        d3.json(`${S3_BASE}/${filename}_${timestamp}.json`).then(data => {
          const svg = d3.select(chartContainer);
          svg.selectAll("*").remove();
          const width = +svg.attr("width");
          const height = +svg.attr("height");

          if (Array.isArray(data) && typeof data[0] === 'number') {
            const x = d3.scaleLinear().domain([0, d3.max(data)]).range([0, width]);
            const bins = d3.bin().domain(x.domain()).thresholds(20)(data);
            const y = d3.scaleLinear().domain([0, d3.max(bins, d => d.length)]).range([height, 0]);

            svg.selectAll(".bar")
              .data(bins)
              .enter().append("rect")
              .attr("x", d => x(d.x0))
              .attr("width", d => Math.max(0, x(d.x1) - x(d.x0) - 1))
              .attr("y", d => y(d.length))
              .attr("height", d => height - y(d.length))
              .style("fill", "#69b3a2");

          } else if (Array.isArray(data) && data[0].id) {
            const yValue = d => d.sentiment ?? d.score ?? d.descendants ?? 0;
            const x = d3.scaleBand().domain(data.map(d => d.id)).range([0, width]).padding(0.1);
            const y = d3.scaleLinear().domain([0, d3.max(data, yValue)]).range([height, 0]);

            svg.selectAll(".bar")
              .data(data)
              .enter().append("rect")
              .attr("x", d => x(d.id))
              .attr("width", x.bandwidth())
              .attr("y", d => y(yValue(d)))
              .attr("height", d => height - y(yValue(d)))
              .style("fill", "#4682b4");

          } else if (Array.isArray(data) && typeof data[0] === 'object') {
            const getX = d => d[0] ?? d.time;
            const getY = d => d[1] ?? d.count;
            const x = d3.scaleBand().domain(data.map(getX)).range([0, width]).padding(0.1);
            const y = d3.scaleLinear().domain([0, d3.max(data, getY)]).range([height, 0]);

            svg.selectAll(".bar")
              .data(data)
              .enter().append("rect")
              .attr("x", d => x(getX(d)))
              .attr("width", x.bandwidth())
              .attr("y", d => y(getY(d)))
              .attr("height", d => height - y(getY(d)))
              .style("fill", "#ff8c00");
          }
        }).catch(e => {
          d3.select(chartContainer).selectAll("*").remove();
          const svg = d3.select(chartContainer);
          svg.append("text")
            .attr("x", 10)
            .attr("y", 30)
            .text(`Data not available for ${filename}`)
            .attr("fill", "red");
        });
      });
    }

    document.querySelectorAll('.analysis-toggle').forEach(toggle => {
      toggle.addEventListener('change', () => {
        const timestamp = document.getElementById('timestampSelector').value;
        loadCharts(timestamp);
      });
    });

    loadTimestamps();
  </script>
</body>
</html>
